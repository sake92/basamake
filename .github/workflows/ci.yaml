name: CI

on:
  push:
    branches: main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# for junit reports
permissions:
  checks: write
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # scala-cli must be installed BEFORE setup-java — it ships its own JVM
      # detection and can interfere with the JDK setup when installed after.
      # SemanticdbFixture compiles test fixtures with scala-cli — required by the
      # sbt-fixture tests in modules-index-test. Pinned to the version used
      # in local dev for deterministic fixture output.
      - name: Install scala-cli
        run: |
          curl -fL https://github.com/VirtusLab/scala-cli/releases/download/v1.8.4/scala-cli-x86_64-pc-linux.gz | gzip -d > scala-cli
          chmod +x scala-cli
          sudo mv scala-cli /usr/local/bin/
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
      - uses: coursier/cache-action@v7
      - name: Set Homebrew env
        shell: bash
        run: echo "HOMEBREW_NO_SANDBOX_LINUX=1" >> $GITHUB_ENV
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
      - name: Install deder
        run: brew install sake92/tap/deder
      - name: Unit tests
        shell: bash -eo pipefail {0}
        run: deder exec -t test -m modules-core-test -m modules-index-test -m modules-bsp-test -m modules-lsp-test
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: success() || failure()
        with:
          report_paths: '.deder/out/**/reports/junit/TEST-*.xml'
