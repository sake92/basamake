name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: coursier/cache-action@v7

      - name: Install scala-cli
        uses: VirtusLab/scala-cli-setup@v1.16
        with:
          scala-cli-version: 1.8.4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set Homebrew env
        shell: bash
        run: echo "HOMEBREW_NO_SANDBOX_LINUX=1" >> $GITHUB_ENV

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Install deder
        run: brew install sake92/tap/deder

      - name: Run tests
        run: deder exec -t test -m modules-lsp-test

      - name: Build assembly JAR
        run: deder exec -t assembly -m modules-lsp

      - name: Prepare artifact
        run: |
          cp .deder/out/modules-lsp/assembly/out.jar basamake.jar
          ls -lh basamake.jar

      # `main` cannot itself be a tag because it is also the branch name. Keep
      # this deliberately mutable tag as the opt-in latest development build.
      - name: Move latest-main tag
        if: github.ref == 'refs/heads/main'
        run: git push --force origin "$GITHUB_SHA:refs/tags/release-main"

      - name: Update latest main release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-main
          name: Latest main
          prerelease: true
          make_latest: false
          files: basamake.jar
          overwrite_files: true
          body: Latest successful build from the `main` branch. This JAR is replaced on every push to `main`.

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: basamake.jar
          generate_release_notes: true
